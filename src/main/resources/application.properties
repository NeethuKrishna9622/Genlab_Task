# Server runs on the same port the React frontend already expects (http://localhost:5000/api)
server.port=5000


spring.datasource.url=jdbc:postgresql://localhost:5432/taskmanager
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Creates/updates tables automatically on startup based on the entity classes.
# Use "validate" instead once you manage schema changes with a migration tool (e.g. Flyway).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Serialize Java camelCase fields as snake_case JSON (due_date, created_at, updated_at, user_id)
# to exactly match the React frontend's expected field names.
spring.jackson.property-naming-strategy=SNAKE_CASE

# ---- JWT ----
# IMPORTANT: override this in production, e.g. via an environment variable:
#   export JWT_SECRET="your-long-random-secret"
jwt.secret=${JWT_SECRET:change_this_to_a_long_random_secret_change_this_to_a_long_random_secret}
jwt.expiration-ms=604800000

# Return a clean 404 JSON instead of a whitelabel error page for unknown routes
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
